<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-labelledby="la-wmd-title la-wmd-desc">
  <title id="la-wmd-title">Ledger Atlas</title>
  <desc id="la-wmd-desc">Ledger Atlas wordmark for dark backgrounds: the teal globe mark followed by the name in SF Pro Display Semibold.</desc>
  <defs>
    <clipPath id="la-wmd-disc"><circle cx="32" cy="32" r="27"/></clipPath>
    <mask id="la-wmd-halo" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="0" y="0" width="64" height="64" fill="#ffffff"/>
      <circle cx="44.5" cy="22" r="9" fill="#000000"/>
    </mask>
  </defs>
  <g transform="translate(4 8) scale(0.875)">
    <g mask="url(#la-wmd-halo)">
      <circle cx="32" cy="32" r="27" fill="none" stroke="#4fc3ce" stroke-width="4"/>
      <g clip-path="url(#la-wmd-disc)" fill="#4fc3ce">
        <rect x="0" y="10.75" width="64" height="2.5"/>
        <rect x="0" y="20.75" width="64" height="2.5"/>
        <rect x="0" y="30.75" width="64" height="2.5"/>
        <rect x="0" y="40.75" width="64" height="2.5"/>
        <rect x="0" y="50.75" width="64" height="2.5"/>
        <path d="M32 5A13.5 27 0 0 1 32 59" fill="none" stroke="#4fc3ce" stroke-width="3.5"/>
      </g>
    </g>
    <circle cx="44.5" cy="22" r="5.5" fill="#4fc3ce"/>
  </g>
  <text x="76" y="48" fill="#f5f5f7" font-family="SF Pro Display, -apple-system, Inter, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.68">Ledger Atlas</text>
</svg>
