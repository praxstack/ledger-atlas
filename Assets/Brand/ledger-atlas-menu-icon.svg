<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" aria-labelledby="ledger-atlas-menu-title ledger-atlas-menu-desc" role="img" shape-rendering="geometricPrecision" viewBox="0 0 32 32"><title id="ledger-atlas-menu-title">Ledger Atlas</title><desc id="ledger-atlas-menu-desc">Ledger Atlas menu bar template icon. A black globe outline with three ledger rules, one meridian and a coordinate dot on a transparent ground; macOS tints it for light, dark and highlighted menu bars. Drawn for 16 point at 1x and 2x.</desc><defs><clipPath id="ledger-atlas-menu-disc"><circle cx="16" cy="16" r="13"/></clipPath><mask id="ledger-atlas-menu-halo" width="32" height="32" x="0" y="0" maskUnits="userSpaceOnUse"><rect width="32" height="32" x="0" y="0" fill="#fff"/><circle cx="22.5" cy="16" r="4.5" fill="#000"/></mask></defs><g mask="url(#ledger-atlas-menu-halo)"><circle cx="16" cy="16" r="12" fill="none" stroke="#000" stroke-width="2"/><g fill="#000" clip-path="url(#ledger-atlas-menu-disc)"><rect width="32" height="2" x="0" y="9"/><rect width="32" height="2" x="0" y="15"/><rect width="32" height="2" x="0" y="21"/><path fill="none" stroke="#000" stroke-width="2" d="M16 4A6.5 12 0 0 1 16 28"/></g></g><circle cx="22.5" cy="16" r="3" fill="#000"/></svg>