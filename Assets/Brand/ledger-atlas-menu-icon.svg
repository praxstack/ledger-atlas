<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="ledger-atlas-menu-title ledger-atlas-menu-desc" shape-rendering="geometricPrecision">
  <title id="ledger-atlas-menu-title">Ledger Atlas</title>
  <desc id="ledger-atlas-menu-desc">Ledger Atlas menu bar template icon. A black globe outline with three ledger rules, one meridian and a coordinate dot on a transparent ground; macOS tints it for light, dark and highlighted menu bars. Drawn for 16 point at 1x and 2x.</desc>
  <defs>
    <clipPath id="ledger-atlas-menu-disc"><circle cx="16" cy="16" r="13"/></clipPath>
    <mask id="ledger-atlas-menu-halo" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect x="0" y="0" width="32" height="32" fill="#ffffff"/>
      <circle cx="22.5" cy="16" r="4.5" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#ledger-atlas-menu-halo)">
    <circle cx="16" cy="16" r="12" fill="none" stroke="#000000" stroke-width="2"/>
    <g clip-path="url(#ledger-atlas-menu-disc)" fill="#000000">
      <rect x="0" y="9" width="32" height="2"/>
      <rect x="0" y="15" width="32" height="2"/>
      <rect x="0" y="21" width="32" height="2"/>
      <path d="M16 4A6.5 12 0 0 1 16 28" fill="none" stroke="#000000" stroke-width="2"/>
    </g>
  </g>
  <circle cx="22.5" cy="16" r="3" fill="#000000"/>
</svg>
