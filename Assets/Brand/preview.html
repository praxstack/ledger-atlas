<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ledger Atlas icons</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 32px; background: #f4f1ea; color: #0b1f3a; }
    h1 { font-size: 22px; font-weight: 650; }
    p { max-width: 40rem; }
    .row { display: flex; flex-wrap: wrap; gap: 28px; align-items: end; margin: 28px 0; }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 8px; font-size: 13px; }
    img.app { width: 256px; height: 256px; }
    img.menu { width: 32px; height: 32px; image-rendering: pixelated; }
    img.menu64 { width: 64px; height: 64px; }
    .dark { background: #0b1f3a; color: #f3ebe0; padding: 24px; border-radius: 16px; }
    .dark img { background: transparent; }
  </style>
</head>
<body>
  <h1>Ledger Atlas</h1>
  <p>Original app icon and small menu icon. Not Perfect. Not Money Manager.</p>
  <div class="row">
    <figure>
      <img class="app" src="ledger-atlas-app-icon.svg" alt="Ledger Atlas app icon">
      <figcaption>App icon 256</figcaption>
    </figure>
    <figure>
      <img class="menu64" src="ledger-atlas-menu-icon.svg" alt="Ledger Atlas menu icon at 64 pixels">
      <figcaption>Menu 64</figcaption>
    </figure>
    <figure>
      <img class="menu" src="ledger-atlas-menu-icon.svg" alt="Ledger Atlas menu icon at 32 pixels">
      <figcaption>Menu 32</figcaption>
    </figure>
  </div>
  <div class="dark">
    <div class="row">
      <figure>
        <img class="app" src="ledger-atlas-app-icon.svg" alt="Ledger Atlas app icon on dark">
        <figcaption>App on dark</figcaption>
      </figure>
      <figure>
        <img class="menu64" src="ledger-atlas-menu-icon.svg" alt="Ledger Atlas menu icon on dark">
        <figcaption>Menu on dark</figcaption>
      </figure>
    </div>
  </div>
</body>
</html>
