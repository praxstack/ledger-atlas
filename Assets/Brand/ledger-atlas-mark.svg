<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="la-mark-title la-mark-desc">
  <title id="la-mark-title">Ledger Atlas</title>
  <desc id="la-mark-desc">Ledger Atlas mark. A globe whose parallels are ledger rules, one meridian, and a single coordinate dot. One colour; safe to tint or use as a template image.</desc>
  <defs>
    <clipPath id="la-mark-disc"><circle cx="32" cy="32" r="27"/></clipPath>
    <mask id="la-mark-halo" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="0" y="0" width="64" height="64" fill="#ffffff"/>
      <circle cx="44.5" cy="22" r="9" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#la-mark-halo)">
    <circle cx="32" cy="32" r="27" fill="none" stroke="#1d1d1f" stroke-width="4"/>
    <g clip-path="url(#la-mark-disc)" fill="#1d1d1f">
      <rect x="0" y="10.75" width="64" height="2.5"/>
      <rect x="0" y="20.75" width="64" height="2.5"/>
      <rect x="0" y="30.75" width="64" height="2.5"/>
      <rect x="0" y="40.75" width="64" height="2.5"/>
      <rect x="0" y="50.75" width="64" height="2.5"/>
      <path d="M32 5A13.5 27 0 0 1 32 59" fill="none" stroke="#1d1d1f" stroke-width="3.5"/>
    </g>
  </g>
  <circle cx="44.5" cy="22" r="5.5" fill="#1d1d1f"/>
</svg>
