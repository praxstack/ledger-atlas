name: Stress

# Runs a filtered set of Swift tests many times on macOS, to catch failures that only show up
# now and then. Start it by hand (Actions > Stress > Run workflow) with a test filter; it also
# runs on a pull request that changes this file.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "swift test --filter value"
        required: true
        default: "LedgerJourneyTests"
      repeat:
        description: "How many times to run it"
        required: true
        default: "25"
  pull_request:
    paths:
      - ".github/workflows/stress.yml"

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stress:
    name: Repeat Swift tests (macOS)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select Xcode
        run: ./scripts/ci/select-xcode.sh
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
      - name: Restore SwiftPM build
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - run: swift build --build-tests
      - name: Repeat
        run: |
          case "$REPEAT" in ''|*[!0-9]*) echo "repeat must be a number"; exit 2;; esac
          failures=0
          for run in $(seq 1 "$REPEAT"); do
            if ! swift test --skip-build --no-parallel --filter "$FILTER" > run.log 2>&1; then
              failures=$((failures + 1))
              echo "== run $run failed"
              grep -E "✘|recorded an issue|Caught error|sqliteFailure" run.log | head -40
            fi
          done
          echo "$failures of $REPEAT runs failed" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
        env:
          FILTER: ${{ inputs.filter || 'LedgerJourneyTests' }}
          REPEAT: ${{ inputs.repeat || '25' }}
