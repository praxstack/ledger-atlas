name: Mac app (DMG)

# Builds Ledger Atlas.app, wraps it in a DMG, and launches it once as a smoke test.
#
# When it runs:
#   - every push to main          -> DMG attached to the run as an artifact (kept 30 days)
#   - a tag like v1.2.0           -> DMG also published as a GitHub Release, once CI has
#                                    passed on the same commit (docs/RELEASING.md)
#   - "Run workflow" on main with a release tag (e.g. v1.0.0-test.1) -> same as pushing that
#                                    tag: the release step creates the tag on GitHub itself
#   - Actions tab > "Run workflow" -> on any branch, e.g. to try a feature branch on your Mac
#   - a pull request labelled "build-dmg"
#
# Signing: ad-hoc by default (no Apple account needed). If the repository has the
# MACOS_CERTIFICATE_P12 secrets set (see docs/development/cloud-and-dmg.md), it signs
# with Developer ID and notarizes instead.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [labeled, synchronize, opened, reopened]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v1.0.0-test.1). Main only; leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  dmg:
    name: Build DMG
    # On PRs: build when the build-dmg label is added, or on new commits while it is on.
    # Adding some other label must not restart (and cancel) a running DMG build.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'build-dmg')
      || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'build-dmg'))
    concurrency:
      # Only PR builds are cancelled by a newer push. Main, tag and release builds get a group
      # per commit (and release tag), so they always finish.
      group: mac-app-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}', github.ref, github.sha, inputs.release_tag) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-26
    timeout-minutes: 90   # a tag build also waits for CI on its commit
    env:
      # The release this run publishes: the pushed v* tag, or the tag given to "Run workflow" on
      # main. Empty for every other build.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.release_tag) || '' }}
    permissions:
      contents: write   # only used to publish a Release on v* tags
      checks: read      # the release gate reads CI's results on the tagged commit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the release tag
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag like v1.0.0 or v1.0.0-test.1"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are made from main only; this run is on $GITHUB_REF_NAME"; exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Tag $RELEASE_TAG already exists; choose the next number"; exit 1
            fi
          fi

      - name: Select Xcode
        run: ./scripts/ci/select-xcode.sh
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}

      - name: Work out version
        id: version
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
          else
            base=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.1.0)
            version="${base#v}-dev.${GITHUB_RUN_NUMBER}+$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Import Developer ID certificate (only if secrets are set)
        id: signing
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APP_PROFILE: ${{ secrets.MACOS_APP_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.MACOS_WIDGET_PROFILE }}
        run: |
          if [ -z "$P12" ] || [ -z "$IDENTITY" ]; then
            echo "No signing secrets; building an ad-hoc signed DMG."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 16)
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" >/dev/null
          # Keep the runner's existing keychains in the search list after ours.
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$kc" "${existing[@]}"
          rm "$RUNNER_TEMP/cert.p12"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          if [ -n "$NOTARY_KEY" ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "notary_key=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$APP_PROFILE" ]; then
            echo "$APP_PROFILE" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
            echo "app_profile=$RUNNER_TEMP/app.provisionprofile" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$WIDGET_PROFILE" ]; then
            echo "$WIDGET_PROFILE" | base64 --decode > "$RUNNER_TEMP/widget.provisionprofile"
            echo "widget_profile=$RUNNER_TEMP/widget.provisionprofile" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary_key }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APP_PROFILE_PATH: ${{ steps.signing.outputs.app_profile }}
          WIDGET_PROFILE_PATH: ${{ steps.signing.outputs.widget_profile }}
        run: ./scripts/package-dmg.sh

      - name: Smoke test (launch from the DMG)
        env:
          DMG_PATH: ${{ steps.package.outputs.dmg }}
        run: ./scripts/ci/smoke-launch.sh "$DMG_PATH"

      - name: Upload DMG
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: LedgerAtlas-${{ steps.version.outputs.version }}-${{ steps.package.outputs.mode }}
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Demo tour (screens and a screen recording of the real app, synthetic ledger)
        # After the DMG upload, so a tour problem never holds back the DMG itself, and never
        # blocks publishing a tagged release.
        continue-on-error: ${{ env.RELEASE_TAG != '' }}
        id: tour
        env:
          DMG_PATH: ${{ steps.package.outputs.dmg }}
        run: ./scripts/ci/demo-tour.sh "$DMG_PATH"

      - name: Upload demo tour
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: demo-tour-${{ steps.version.outputs.version }}
          path: dist/demo-tour
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: xcodebuild-log
          path: .build/xcode.log
          if-no-files-found: ignore

      # A release only ships from a commit whose CI ran to the end and passed (#186).
      - name: Wait for green CI on this commit (releases only)
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/wait-for-green-ci.sh "$GITHUB_SHA" 45

      - name: Publish GitHub Release (releases only)
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7}. Signing: ${{ steps.package.outputs.mode }}."
          if [ "${{ steps.package.outputs.mode }}" = "ad-hoc" ]; then
            notes="$notes Not notarized: the first time you open it, go to System Settings > Privacy & Security and click Open Anyway."
          fi
          # Written release notes, when the tag has them (docs/releases/<tag>.md), with the
          # build line underneath.
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            { cat "docs/releases/$RELEASE_TAG.md"; printf '\n\n%s\n' "$notes"; } > "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
          fi
          # v1.0.0-test.1 or v1.0.0-rc.1 is a pre-release; v1.0.0 is a full release, so it gets
          # the Latest badge that docs/INSTALL.md sends people to.
          kind=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then kind=(--prerelease); fi
          # --target creates the tag on this commit when the run was started by hand.
          gh release create "$RELEASE_TAG" dist/*.dmg dist/*.sha256 --target "$GITHUB_SHA" \
            --title "Ledger Atlas $RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md" "${kind[@]}"

      - name: Clean up keychain
        if: always()
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          [ -f "$kc" ] && security delete-keychain "$kc" || true
          rm -f "$RUNNER_TEMP"/*.p8 "$RUNNER_TEMP"/*.provisionprofile
