name: CI

# Runs on every pull request, every push to main, and every v* tag.
# - checks (Linux, cheap): web demo lint/typecheck/tests/build + Python lint/tests
# - swift (macOS): swift build, swift test, mmctl smoke
# The Swift job skips docs-only PRs. A newer push to a PR cancels its older run; runs on main
# and on tags always finish, so every main commit gets its own result and a release can check
# it (scripts/ci/wait-for-green-ci.sh, #186).

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A PR's newer push cancels its older run. Pushes to main and tags get a group per commit, so
# their runs never cancel or replace each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Web + Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - name: Ruff
        run: |
          .venv/bin/ruff check scripts .codex/hooks tests/orchestration
          .venv/bin/ruff format --check scripts .codex/hooks tests/orchestration
      - run: .venv/bin/python -m pytest tests/orchestration
      - name: JSON files parse
        run: |
          .venv/bin/python -m json.tool .codex/hooks.json >/dev/null
          .venv/bin/python -m json.tool prd.json >/dev/null

  changes:
    name: Detect Swift changes
    # Only pull requests skip the Swift jobs; pushes and tags always run them.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists the PR's changed files
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            swift:
              - 'Sources/**'
              - 'tests/**'
              - 'Package.swift'
              - 'Package.resolved'
              - 'project.yml'
              - 'LedgerAtlas.xcodeproj/**'
              - '*.entitlements'
              - 'scripts/**'
              - '.github/workflows/**'

  # What the Keychain allows an ad-hoc signed, sandboxed, optimized build like the shipped
  # DMG, including after an update (see scripts/ci/keychain-probe.sh). Its own job so the
  # table is easy to find; informational, never fails the run.
  keychain-probe:
    name: Keychain probe (macOS)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-26
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select Xcode
        run: ./scripts/ci/select-xcode.sh
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
      - name: Keychain probe
        run: ./scripts/ci/keychain-probe.sh

  # The shipped app is a release build, and some Keychain fallbacks exist only in debug builds.
  # Import a synthetic Money Manager backup through a release build so a debug-only path can't
  # hide a failure the DMG would hit (the receipt key, #153).
  release-import:
    name: Release-mode import (macOS)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select Xcode
        run: ./scripts/ci/select-xcode.sh
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
      - name: Import tests in a release build
        run: >-
          swift test -c release -Xswiftc -enable-testing --no-parallel
          --filter 'ObservedV19FullSchemaImportTests|ImportWorkspaceTests'

  swift:
    name: Swift build + test (macOS)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.swift == 'true') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select Xcode
        run: ./scripts/ci/select-xcode.sh
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Runner display (for UI tests that render windows)
        run: system_profiler SPDisplaysDataType | grep -iE 'resolution|display type' || true
      - run: swift build
      # Full Keyboard Access (System Settings > Keyboard > Keyboard navigation), as a
      # keyboard-only user has it, so the keyboard tests can Tab to every control (#57).
      - name: Turn on Full Keyboard Access
        run: |
          defaults write -g AppleKeyboardUIMode -int 2
          echo "LEDGER_EXPECT_FULL_KEYBOARD_ACCESS=1" >> "$GITHUB_ENV"
      # Serial on purpose: several tests block a thread (condition/semaphore waits,
      # waitUntilExit) while another test-side task finishes the work. On a 3-core
      # runner the parallel Swift Testing pool runs out of threads and every test
      # stalls (seen on run 41355070020). Serial runs keep a free thread.
      # A test process that quits early (exit 0, no summary) must not pass: require Swift
      # Testing's closing "Test run with N tests ... passed" line.
      - name: swift test
        run: |
          set -o pipefail
          swift test --no-parallel 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          grep -qE "Test run with [0-9]+ tests? .*passed" "$RUNNER_TEMP/swift-test.log" || {
            echo "::error::swift test ended without its passing summary; the test process stopped early"
            exit 1
          }
        timeout-minutes: 30
        env:
          LEDGER_ATLAS_TEST_ARTIFACTS: ${{ runner.temp }}/test-artifacts
      # A crashed test process (for example SIGSEGV) prints no test name or stack, so show
      # the newest crash report's faulting thread in the log.
      - name: Show test crash report
        if: failure()
        run: |
          # The crash reporter writes the report a few seconds after the process dies.
          for _ in $(seq 1 20); do
            ls ~/Library/Logs/DiagnosticReports/*.ips >/dev/null 2>&1 && break
            sleep 2
          done
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1); do
            echo "== $f"
            python3 scripts/ci/print-crash.py "$f" || head -c 20000 "$f"
          done
      # MACV2-21 (#57): the synthetic UI captures for the 25 screenshot traceability records
      # and key states, light and dark. Uploaded even when a check fails, to see what went wrong.
      - name: Upload UI captures
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ui-captures
          path: ${{ runner.temp }}/test-artifacts/ui-captures
          retention-days: 30
          if-no-files-found: ignore
      - name: Upload test captures on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: swift-test-captures
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore
      # MACV2-21 (#57): time a 100,000-entry synthetic ledger and keep the receipt. Only on
      # main and manual runs, because it adds a few minutes.
      - name: Performance receipt (100,000 entries)
        if: github.event_name != 'pull_request'
        run: |
          swift test --no-parallel --filter LedgerPerformanceReceiptTests
          python3 scripts/ci/performance-receipt-summary.py \
            "$RUNNER_TEMP/performance/performance-receipt-100k.json" >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 20
        env:
          LEDGER_ATLAS_PERFORMANCE_RECEIPT: "1"
          LEDGER_ATLAS_TEST_ARTIFACTS: ${{ runner.temp }}/performance
      - name: Upload performance receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: performance-receipt-100k
          path: ${{ runner.temp }}/performance
          if-no-files-found: ignore
      - run: swift run mmctl
      # Measures which file operations the App Sandbox allows next to a user-chosen
      # path (see scripts/ci/sandbox-probe.sh). Prints a table in the job summary.
      - name: Sandbox file-access probe
        run: ./scripts/ci/sandbox-probe.sh
        continue-on-error: true
