name: CI

# Runs on every pull request and every push to main.
# - checks (Linux, cheap): web demo lint/typecheck/tests/build + Python lint/tests
# - swift (macOS): swift build, swift test, mmctl smoke
# The Swift job skips docs-only PRs, and older runs on the same branch are cancelled.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Web + Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --frozen
      - name: Ruff
        run: |
          .venv/bin/ruff check scripts .codex/hooks tests/orchestration
          .venv/bin/ruff format --check scripts .codex/hooks tests/orchestration
      - run: .venv/bin/python -m pytest tests/orchestration
      - name: JSON files parse
        run: |
          .venv/bin/python -m json.tool .codex/hooks.json >/dev/null
          .venv/bin/python -m json.tool prd.json >/dev/null

  changes:
    name: Detect Swift changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists the PR's changed files
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            swift:
              - 'Sources/**'
              - 'tests/**'
              - 'Package.swift'
              - 'Package.resolved'
              - 'project.yml'
              - 'LedgerAtlas.xcodeproj/**'
              - '*.entitlements'
              - 'scripts/**'
              - '.github/workflows/**'

  swift:
    name: Swift build + test (macOS)
    needs: changes
    if: needs.changes.outputs.swift == 'true' || github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select Xcode
        run: ./scripts/ci/select-xcode.sh
        env:
          XCODE_VERSION: ${{ vars.XCODE_VERSION }}
      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Runner display (for UI tests that render windows)
        run: system_profiler SPDisplaysDataType | grep -iE 'resolution|display type' || true
      - run: swift build
      # Serial on purpose: several tests block a thread (condition/semaphore waits,
      # waitUntilExit) while another test-side task finishes the work. On a 3-core
      # runner the parallel Swift Testing pool runs out of threads and every test
      # stalls (seen on run 41355070020). Serial runs keep a free thread.
      - name: swift test
        run: swift test --no-parallel
        timeout-minutes: 30
        env:
          LEDGER_ATLAS_TEST_ARTIFACTS: ${{ runner.temp }}/test-artifacts
      # A crashed test process (for example SIGSEGV) prints no test name or stack, so show
      # the newest crash report's faulting thread in the log.
      - name: Show test crash report
        if: failure()
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1); do
            echo "== $f"
            python3 scripts/ci/print-crash.py "$f" || head -c 20000 "$f"
          done
      - name: Upload test captures on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: swift-test-captures
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore
      - run: swift run mmctl
      # Measures which file operations the App Sandbox allows next to a user-chosen
      # path (see scripts/ci/sandbox-probe.sh). Prints a table in the job summary.
      - name: Sandbox file-access probe
        run: ./scripts/ci/sandbox-probe.sh
        continue-on-error: true
