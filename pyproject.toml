[project]
name = "ledger-atlas-orchestration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.16.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/orchestration"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".orchestrion/runtime", ".build"]
